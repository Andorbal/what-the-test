name: Release

# Push a tag created by `npm version` (e.g. v0.2.0) to publish a release.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      pre-release: ${{ steps.info.outputs.pre-release }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches package.json and CHANGELOG.md
        id: info
        run: |
          info=$(node scripts/package.mjs --print)
          version=$(echo "$info" | node -p 'JSON.parse(require("fs").readFileSync(0)).version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          node scripts/changelog.mjs notes "$version" > /dev/null
          echo "pre-release=$(echo "$info" | node -p 'JSON.parse(require("fs").readFileSync(0)).preRelease')" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    uses: ./.github/workflows/ci.yml

  release:
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: vsix
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/changelog.mjs notes "${GITHUB_REF_NAME#v}" > notes.md
          flags=""
          if [ "${{ needs.verify.outputs.pre-release }}" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" *.vsix --title "$GITHUB_REF_NAME" --notes-file notes.md $flags

  # A separate job so a failed publish can be re-run without re-creating the GitHub Release.
  publish-vscode:
    name: Publish to the VS Code Marketplace
    needs: release
    runs-on: ubuntu-latest
    # Its federated credential (RELEASING.md) trusts only jobs in this environment.
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned vsce
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: artifacts
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish
        # The .vsix already records whether it is a pre-release.
        run: npx vsce publish --azure-credential --packagePath artifacts/*.vsix

  publish-openvsx:
    name: Publish to Open VSX
    needs: release
    runs-on: ubuntu-latest
    # Holds the OVSX_PAT secret (RELEASING.md).
    environment: open-vsx
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          name: vsix
          path: artifacts
      - name: Publish
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        # The .vsix already records whether it is a pre-release.
        run: npx --yes ovsx@1.2.0 publish --packagePath artifacts/*.vsix
