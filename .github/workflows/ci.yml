name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow so a release is built exactly like CI builds.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Integration tests (TypeScript)
        run: xvfb-run -a npm run test:integration
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Integration tests (C#)
        run: xvfb-run -a npm run test:integration:csharp

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package .vsix
        id: package
        run: |
          npm run package
          echo "file=$(node scripts/package.mjs --print | node -p 'JSON.parse(require("fs").readFileSync(0)).file')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
