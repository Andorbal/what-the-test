name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Integration tests (TypeScript)
        run: xvfb-run -a npm run test:integration
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Integration tests (C#)
        run: xvfb-run -a npm run test:integration:csharp
      - run: npx vsce package --out what-the-test.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: what-the-test-vsix
          path: what-the-test.vsix
