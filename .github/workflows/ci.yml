name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Called by the release workflow so a release is built exactly like CI builds.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Integration tests (TypeScript)
        run: xvfb-run -a npm run test:integration
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Integration tests (C#)
        run: xvfb-run -a npm run test:integration:csharp
      - name: Integration tests (F#)
        run: xvfb-run -a npm run test:integration:fsharp
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false
      - name: Install gopls
        run: go install golang.org/x/tools/gopls@latest
      - name: Integration tests (Go)
        run: xvfb-run -a npm run test:integration:go
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Integration tests (Python)
        run: xvfb-run -a npm run test:integration:python
      - name: Integration tests (Java)
        run: xvfb-run -a npm run test:integration:java

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Package .vsix
        id: package
        run: |
          npm run package
          echo "file=$(node scripts/package.mjs --print | node -p 'JSON.parse(require("fs").readFileSync(0)).file')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
