name: Marketplace check

# Run by hand to check publishing before tagging a release (RELEASING.md). It
# authenticates exactly as the release's publish jobs do and checks that each can
# publish as AndrewBenz: to the VS Code Marketplace and to Open VSX. It publishes nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-vscode:
    name: Check VS Code Marketplace publish rights
    runs-on: ubuntu-latest
    environment: vscode-marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install the pinned vsce
        run: npm ci
      - name: Sign in to Microsoft Entra ID
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Check publish rights for AndrewBenz
        run: |
          if npx vsce verify-pat --azure-credential AndrewBenz; then
            echo "### The identity can publish as AndrewBenz" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### The identity can't publish as AndrewBenz: is it a member of the publisher?" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  check-openvsx:
    name: Check Open VSX publish rights
    runs-on: ubuntu-latest
    environment: open-vsx
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check publish rights for the AndrewBenz namespace
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if npx --yes ovsx@1.2.0 verify-pat AndrewBenz; then
            echo "### The OVSX_PAT token can publish to the AndrewBenz namespace" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### The OVSX_PAT token can't publish to AndrewBenz: is the secret set and the namespace created?" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
